<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | EarlyLearnerStar</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ff;
      color: #2b2b2b;
      text-align: center;
    }

    .thank-you {
      max-width: 700px;
      margin: 80px auto;
      padding: 40px 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      color: #6c63ff;
      font-size: 38px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .message {
      margin-top: 25px;
      padding: 20px;
      background: #f6f4ff;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="thank-you">

    <h1>⭐ Thank You!</h1>

    <p>
      Thank you for supporting EarlyLearnerStar!
    </p>

    <div class="message">
      <p>
        Your A–I Alphabet Workbook purchase was successful.
      </p>

      <p>
        Your download information will be provided here.
      </p>
    </div>

  </div>

</html>
